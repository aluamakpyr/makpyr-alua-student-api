spring.application.name=makpyr-alua-student-api
server.port=8081
server.servlet.context-path=/makpyr-alua

app.version=1.0.0
app.student=Alua Makpyr

# Real values come from environment variables (docker-compose.yml / .env)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/makpyr_alua_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:makpyr_alua}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
